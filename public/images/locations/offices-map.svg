<title id="s-t">Sunlife Traders LLP offices in Kerala and Tamil Nadu</title>
  <desc id="s-d">Kerala and Tamil Nadu with five numbered offices: Kollam, Thiruvananthapuram, Karankodu, Thiruvithancode and Chennai.</desc>
  <style>
    .s text { font-family: 'Familjen Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif; }
    .s-panel { stroke: #FFFFFF; stroke-width: 1.4; fill-rule: evenodd; }
    .s-name { fill: #AEABA5; font-size: 12px; font-weight: 500; letter-spacing: .26em; }
    .s-num { fill: #A8A49D; font-family: 'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 9.5px; letter-spacing: .16em; }
    .s-city { fill: #2B2B28; font-size: 12.5px; font-weight: 500; letter-spacing: .005em; }
    .s-tick { stroke: #A8A49D; stroke-width: 1; opacity: .8; }
    .s-site { cursor: pointer; outline: none; }
    .s-ring { fill: none; stroke: #f97316; stroke-width: 1.1; opacity: .45;
      transition: opacity .22s ease; }
    .s-disc { fill: #f97316; }
    .s-rays { stroke: #f97316; stroke-width: 1.4; stroke-linecap: round; fill: none;
      opacity: 0; transition: opacity .22s ease; }
    .s-site:hover .s-rays, .s-site:focus-visible .s-rays, .s-site.is-on .s-rays { opacity: 1; }
    .s-site:hover .s-ring, .s-site:focus-visible .s-ring, .s-site.is-on .s-ring { opacity: 0; }
    .s-site:hover .s-num, .s-site:focus-visible .s-num, .s-site.is-on .s-num { fill: #f97316; }
    @media (prefers-reduced-motion: reduce) { .s-rays, .s-ring { transition: none; } }
    @media (max-width: 700px) {
      .s-city, .s-tick { display: none; }
      .s-num { font-size: 15px; }
      .s-name { font-size: 17px; letter-spacing: .18em; }
    }
  </style>
